<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .buttonColor {
        background-color: aqua;
        color: black;
      }

      .buttonLayout {
        text-align: center;
        width: 120px;
      }

      .staticBorder {
        border: khaki dashed 1px;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <input type="checkbox" v-model="isMyLayout" />
      레이아웃 적용 여부<br />
      <!-- :class = 객체로 접근 -->
      <!-- <button class="staticBorder" :class="myColor">버튼</button> -->
      <!-- 여러 CSS 속성 적용 -->
      <!-- <button class="staticBorder" :class="[myColor, myLayout]">버튼</button> -->
      <!-- 삼항연산자 : 함수 호출 없이 스타일 선택 -->
      <button
        class="staticBorder"
        :class="[myColor, isMyLayout ? myLayout : '']"
      >
        버튼
      </button>
    </div>
    <script src="https://unpkg.com/vue"></script>
    <script>
      let vm = Vue.createApp({
        name: 'App',
        data() {
          return {
            //css를 변경하고 싶으면 속성명으로 지정
            myColor: 'buttonColor',
            myLayout: 'buttonLayout',
            isMyLayout: false,
          };
        },
      }).mount('#app');
    </script>
  </body>
</html>
