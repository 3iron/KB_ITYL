<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Feature</title>
    <style>
      @media screen and (orientation: portrait) {
        body {
          background-color: red;
        }
      }

      @media screen and (orientation: landscape) {
        body {
          background-color: green;
        }
      }
    </style>
  </head>
  <body>
    <h1>Lorem ipsum dolor sit amet.</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Esse nostrum
      error corrupti enim illo ex perspiciatis laborum nemo, expedita
      consequatur similique tempore, rerum repellat quasi quibusdam! Maxime
      magnam odio eveniet?
    </p>
  </body>
</html>
