<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        width: 960px;
        margin: 0 auto;
        overflow: hidden;
      }
      #menu {
        width: 260px;
        float: left;
      }
      #section {
        width: 700px;
        float: right;
        /* left로 입력해도 상관 없음 */
      }
      li {
        list-style: none;
      }

      @media screen and (max-width: 767px) {
        /* 스마트폰 사이즈에서는 전부 해제 */
        body {
          width: auto;
        }
        #menu {
          width: auto;
          float: none;
        }
        #section {
          width: auto;
          float: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="section">
      <h1>Lorem, ipsum.</h1>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloribus
        beatae ipsa sapiente non tempora omnis quod, possimus quo numquam
        deleniti porro vitae, reprehenderit, voluptatibus dignissimos architecto
        eligendi nulla illum quas.
      </p>
    </div>
    <div id="menu">
      <ul>
        <li>메뉴A</li>
        <li>메뉴B</li>
        <li>메뉴C</li>
      </ul>
    </div>
  </body>
</html>
