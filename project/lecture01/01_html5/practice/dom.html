<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function rec() {
        // 1. 입력
        // 가로값
        let n1 = document.getElementById('n1').value;
        // input태그에서 value 속성값만 가지고 와라, 100
        // 세로값
        let n2 = document.getElementById('n2').value; //200
        // 2. 처리
        // 면적 계산
        let n11 = parseInt(n1);
        let n22 = parseInt(n2);
        let result = n11 * n22;
        // 3. 출력
        // 출력
        alert('사각형의 면적 결과 : ' + result);
      }

      // 브라우저의 input에서 입력한 value 값은 모두 문자로 취급함.
    </script>
  </head>
  <body>
    <span style="color: blue">가로값</span> :
    <input type="text" id="n1" value="" /> <br />
    세로값 : <input type="text" id="n2" /> <br />
    <!-- <button
      style="background: yellow; color: red"
      onclick="alert('버튼 클릭 했군')"
    > -->
    <button style="background: yellow; color: red" onclick="rec()">
      사각형의 면적 구하기
    </button>
  </body>
</html>
