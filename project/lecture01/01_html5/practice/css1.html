<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* CSS 주석 */
      /* * {
        color: red;
      } */
      h1 {
        color: red;
      }
      p {
        color: blue;

    <div id="wrap">
      <div id="aside">
        <h1>#aside태그</h1>
      </div>
      <div id="content">
        <h1>#content태그</h1>
      </div>
    </div>
    <ul>
      <li class="select">사과</li>
      <li>바나나</li>
      <li class="select">오렌지</li>
      <li>감</li>
