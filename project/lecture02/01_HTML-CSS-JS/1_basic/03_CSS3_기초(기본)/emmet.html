<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- ul>li*6 : 바로 list 6개 만드는 단축키  -->
    <!-- ul>li*6 -->
    <ul>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>
    <ul>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>

    <header></header>
    <main></main>
    <footer></footer>
    <!-- header+main+footer -->
    <header></header>
    <main></main>
    <footer></footer>

    <!-- ul>li.test -->
    <ul>
      <li class="test"></li>
    </ul>

    <!-- div>div>p#test -->
    <div>
      <div>
        <p id="test"></p>
      </div>
    </div>

    <!-- ctrl + space : 자동완성 안 뜰 때  -->

    <!-- ul>li{1}*10 -->
    <ul>
      <li>1</li>
      <li>1</li>
      <li>1</li>
      <li>1</li>
      <li>1</li>
      <li>1</li>
      <li>1</li>
      <li>1</li>
      <li>1</li>
      <li>1</li>
    </ul>

    <!-- ul>li{$}*10 : 1씩 증가 -->
    <ul>
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
      <li>6</li>
      <li>7</li>
      <li>8</li>
      <li>9</li>
      <li>10</li>
    </ul>

    <!-- 예문 -->
    <!-- ul>li.li$#li$*3{li요소} -->
    <ul>
      <li class="lili1">li요소</li>
      <li class="lili2">li요소</li>
      <li class="lili3">li요소</li>
    </ul>

    <!--  ul>li.li$#li$*3{li요소} -->
    <ul>
      <li class="lili1">li요소</li>
      <li class="lili2">li요소</li>
      <li class="lili3">li요소</li>
    </ul>

    <!--  ul>li#li$.li$*3{li요소} -->
    <ul>
      <li id="li1" class="li1">li요소</li>
      <li id="li2" class="li2">li요소</li>
      <li id="li3" class="li3">li요소</li>
    </ul>

    <ul>
      <li class="li1" id="li1">li요소</li>
      <li class="li2" id="li2">li요소</li>
      <li class="li3" id="li3">li요소</li>
    </ul>
  </body>
</html>
