<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #structure {
        overflow: hidden;
      }
      #structure > li {
        list-style: none;
        float: left;
        padding: 15px;
      }
      /* 짝수 */
      ul :nth-child(2n) {
        background-color: red;
      }
      /* 홀수 */
      ul :nth-child(2n-1) {
        background-color: brown;
      }
      /* 첫번째 자식 */
      ul :first-child {
        border-radius: 10px 0 0 10px;
      }
      /* 마지막 자식 */
      ul :last-child {
        border-radius: 0 10px 10px 0;
      }
    </style>
  </head>
  <body>
    <div>
      <ul id="structure">
        <li>첫 번째</li>
        <li>두 번째</li>
        <li>세 번째</li>
        <li>네 번째</li>
        <li>다섯 번째</li>
        <li>여섯 번째</li>
        <li>일곱 번째</li>
      </ul>
    </div>
  </body>
</html>
