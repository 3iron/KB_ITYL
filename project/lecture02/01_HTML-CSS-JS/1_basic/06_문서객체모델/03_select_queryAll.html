<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script>
      window.onload = function () {
        let header = document.querySelectorAll('h1');
        // 요소를 여러 개 접근하는 경우 [배열] 형태로 반환됨
        // -> 배열 내 요소에 css, 이벤트 등을 적용하고 싶으면
        //    인덱스 번호를 이용하여 요소 하나에 직접 적용해야 한다.

        for (let i = 0; i < header.length; i++) {
          header[i].style.color = 'orange';
          header[i].style.background = 'red';
          header[i].innerHTML = 'From Java Script';
        }
      };
    </script>
  </head>
  <body>
    <h1>Header</h1>
    <h1>Header</h1>
    <h1>Header</h1>
  </body>
</html>
