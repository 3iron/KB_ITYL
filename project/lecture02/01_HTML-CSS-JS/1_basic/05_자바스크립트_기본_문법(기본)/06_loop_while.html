<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script>
      console.log(3 == '3');
      // 10, 20, 30, 40, 50을 배열로 정의
      let array = [10, 20, 30, 40, 50];
      console.log(array);
      console.log(array[2]); // 30

      // 배열의 길이
      console.log(array.length);
      // 마지막 인덱스 번호는 길이 -1

      // for 반복문을 이용하여 출력
      // for문 안에서는 const 불가 -> let 으로
      //   for (let index = 0; index < array.length; index += 1) {
      //     alert(array[index]);
      //   }

      let index = 0;
      while (index < array.length) {
        alert(array[index]);
        index += 1;
      }
    </script>
  </head>

</html>
