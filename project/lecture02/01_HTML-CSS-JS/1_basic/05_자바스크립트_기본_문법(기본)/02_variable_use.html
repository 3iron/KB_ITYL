  <body>
    <h3>변수 선언 방식</h3>
    <!-- pre 태그 : 문단 -->
    <pre>
      var   : 변수, 변수명 중복 O(덮어쓰기), 함수 레벨 scope
      let   : 변수, 변수명 중복 X, 블록{} 레벨 scope
      const : 상수, 변수명 중복 X, 블록{} 레벨 scope
    </pre>

    <script>
      // 변수를 선언 및 초기화
      // 초기화 : 처음으로 값을 할당하는 것
      let radius = 10;
      let pi = 3.14159265;

      // 출력
      // alert(2 * 10 * 3.14159265);
      alert(2 * radius * pi);
    </script>
  </body>
