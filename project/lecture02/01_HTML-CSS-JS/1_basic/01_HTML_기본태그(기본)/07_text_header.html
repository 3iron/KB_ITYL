<!doctype html>
<html lang="en">
  <!-- head : 설정 정보 -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <!-- body : 사용자에게 보여지는 부분 -->

  <body>
    <!-- h1 ~ h6 -->
    <!-- shift + alt + 아래키 (win) / 
        Shift + Option + 아래키 (mac): 한 줄 복사 -->
    <h1>제목 글자 태그 1</h1>
    <h2>제목 글자 태그 2</h2>
    <h3>제목 글자 태그 3</h3>
    <h4>제목 글자 태그 4</h4>
    <h5>제목 글자 태그 5</h5>
    <h6>제목 글자 태그 6</h6>

    <!-- script 위치 : 보통 body 태그 닫히는 부분 위에 작성 -->
  </body>
</html>
