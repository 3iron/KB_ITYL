<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        z-index: 1;
      }
      .box {
        width: 100px;
        height: 100px;
        position: absolute;
      }
      .box:first-child {
        background-color: red;
        left: 0px;
        top: 0px;
        z-index: 100;
      }
      .box:nth-child(2) {
        background-color: green;
        left: 40px;
        top: 40px;
        z-index: 50;
      }
      .box:last-child {
        background-color: blue;
        left: 80px;
        top: 80px;
        z-index: 30;
      }
      body > div {
        width: 400px;
        height: 100px;
        position: relative;
        border: 3px solid black;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>Lorem ipsum dolor amet</h1>
    <div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
    <h1>Lorem ipsum dolor amet</h1>
  </body>
</html>
