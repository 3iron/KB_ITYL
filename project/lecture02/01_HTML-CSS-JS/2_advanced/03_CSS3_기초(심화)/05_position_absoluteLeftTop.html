<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 90px;
        height: 90px;
        position: absolute;
      }

      .box:first-child {
        background-color: red;
        left: 0px;
        top: 0px;
        z-index: 1;
      }
      .box:nth-child(2) {
        background-color: green;
        left: 40px;
        top: 40px;
        z-index: 10;
      }
      .box:last-child {
        background-color: blue;
        left: 80px;
        top: 80px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </body>
</html>
