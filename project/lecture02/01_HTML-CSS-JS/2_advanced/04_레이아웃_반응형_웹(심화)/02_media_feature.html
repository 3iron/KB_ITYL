<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 폰 : 767px, 패드 : 768px, 웹 : 960px */
      /* 스마트폰 */
      @media screen and (max-width: 767px) {
        body {
          background: red;
        }
      }
      @media screen and (min-width: 768px) and (max-width: 959px) {
        body {
          background: green;
        }
      }
      @media screen and (min-width: 960px) {
        body {
          background: blue;
        }
      }
    </style>
  </head>
  <body>
    <h1>Lorem ipsum dolor sit amet</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nam eius
      suscipit provident exercitationem. Sed veniam incidunt, impedit eos
      aperiam harum officiis commodi accusantium? Ab laborum tempore aspernatur
      dolorum facere quia!
    </p>
  </body>
</html>
