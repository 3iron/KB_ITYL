<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <fieldset>
      <legend>회원가입</legend>
      <form action="">
        <div>
          <label for="id">사용자 ID</label>
          <input type="text" id="id" />
        </div>
        <div>
          <label for="pw">비밀번호</label>
          <input type="password" id="pw" />
        </div>
        <div>
          <label for="pwchk">비밀번호 확인</label>
          <input type="password" id="pwchk" />
        </div>
        <div>
          <label for="naem">이름</label>
          <input type="text" id="name" />
        </div>
        <div>
          <span>성별</span>
          <input type="radio" name="gender" id="male" />
          <label for="male">남</label>
          <input type="radio" name="gender" id="female" />
          <label for="female">여</label>
        </div>
        <div>
          <span>취미</span>
          <input type="checkbox" id="soccer" />
          <label for="soccer">축구</label>
          <input type="checkbox" id="baseball" />
          <label for="baseball">야구</label>
          <input type="checkbox" id="handball" />
          <label for="handball">배구</label>
          <input type="checkbox" id="basketball" />
          <label for="basketball">농구</label>
        </div>
        <div>
          <label for="mail">이메일</label>
          <input type="text" id="mail" />
        </div>
        <div>
          <label for="role">역할</label>
          <select name="role" id="role">
            <option value="admin">관리자</option>
            <option value="normal">일반회원</option>
          </select>
        </div>
        <button type="submit">확인</button>
        <button type="reset">다시쓰기</button>
      </form>
    </fieldset>
  </body>
</html>
