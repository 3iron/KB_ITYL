<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KB Page</title>
    <!-- link 태그 : CSS 파일과 연결 -->
    <link rel="stylesheet" href="KB_page.css" />
  </head>
  <body>
    <main>
      <header>
        <!-- 1. 이미지 -->
        <section>
          <!-- 클릭 시 메인 페이지로 이동하는 로고 -->
          <a href="#">
            <img src="KB.png" alt="logo" id="main-logo" />
          </a>
        </section>

        <!-- 2. 검색창 -->
        <section>
          <section class="search-area">
            <!-- form 태그 내부의 input 태그 값이
            서버 또는 페이지로 전달 
            단, input의 "name 속성"이 존재해야만 전달됨 -->
            <form action="#" name="search-form">
              <!-- fieldset : form 태그 내부에서 input을 
                            종류별로 묶는 용도로 많이 사용함 -->
              <fieldset>
                <!-- input name에 query를 많이 쓴다. -->
                <!-- autocomplete : 자동완성. 기본값(on)  -->
                <input
                  type="text"
                  name="query"
                  placeholder="검색어를 입력해주세요"
                  autocomplete="off"
                  id="query"
                />
                <button id="search-btn">검색</button>
              </fieldset>
            </form>
          </section>
        </section>
        <!-- 3. 나중에 쓸 공간 -->
        <section></section>
      </header>
      <nav>
        <ul>
          <li><a href="#">K-디지털</a></li>
          <li><a href="#">프로그래밍</a></li>
          <li><a href="#">데이터 분석</a></li>
          <li><a href="#">정보보안</a></li>
          <li><a href="#">클라우드</a></li>
        </ul>
      </nav>
      <section class="content">
        <!-- 좌 -->
        <section>
          <h1>주요 컨텐츠 작성 부분</h1>
        </section>
        <!-- 우 -->
        <section>
          <h1>사이드 메뉴</h1>
        </section>
      </section>
      <footer>
        <!--  &copy; : © (특수문자) -->
        <!-- | : 버티컬 바 -->
        <p>Copyright &copy; KB It's your life 606 class</p>
        <article>
          <a href="#">프로젝트 소개</a>
          <span>|</span>
          <a href="#">이용약관</a>
          <span>|</span>
          <a href="#">개인정보처리방침</a>
          <span>|</span>
          <a href="#">고객센터</a>
        </article>
      </footer>
    </main>
  </body>
</html>
