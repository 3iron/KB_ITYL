<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue 게시판 목록 v2</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>📌 게시판 목록 v2</h1>

      <ul>
        <li v-for="post in posts" :key="post.no">
          <div class="post-item" @click="togglePost(post.no)">
            <span>{{ post.no }}. {{ post.title }}</span>
            <span class="arrow">
              {{ openedPostNo === post.no ? '▲' : '▼' }}
            </span>
          </div>

          <div class="post-content" v-show="openedPostNo === post.no">
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
            <button @click.stop="closePost">닫기</button>
          </div>
        </li>
      </ul>
    </div>

    <script>
      Vue.createApp({
        data() {
          return {
            posts: [
              {
                no: 1,
                title: 'Vue.js 기초 배우기',
                content:
                  'Vue.js는 사용자 인터페이스를 구축하기 위한 프로그레시브 프레임워크입니다.',
              },
              {
                no: 2,
                title: '자바스크립트 ES6 문법',
                content:
                  'ES6는 JavaScript의 최신 문법을 포함하며, let/const, 화살표 함수, 구조 분해 할당 등을 제공합니다.',
              },
              {
                no: 3,
                title: 'Node.js와 Express',
                content:
                  'Node.js는 서버 측에서 JavaScript를 실행할 수 있도록 하는 런타임이며, Express는 이를 위한 경량 웹 프레임워크입니다.',
              },
              {
                no: 4,
                title: 'MongoDB 기본 개념',
                content:
                  'MongoDB는 NoSQL 데이터베이스로 JSON과 유사한 문서 기반 데이터를 저장하고 관리할 수 있습니다.',
              },
              {
                no: 5,
                title: '프론트엔드와 백엔드의 차이',
                content:
                  '프론트엔드는 사용자가 보는 부분을 개발하는 것이고, 백엔드는 서버와 데이터베이스를 관리하는 부분입니다.',
              },
              {
                no: 6,
                title: '비동기 프로그래밍',
                content:
                  'JavaScript의 비동기 처리 방식에는 콜백, 프로미스, async/await가 있습니다.',
              },
              {
                no: 7,
                title: 'Vue Router 사용법',
                content:
                  'Vue Router를 사용하면 Vue.js 애플리케이션에서 페이지 이동을 쉽게 처리할 수 있습니다.',
              },
              {
                no: 8,
                title: '컴포넌트 기반 개발',
                content:
                  'Vue.js에서는 컴포넌트를 사용하여 UI를 작은 단위로 쪼개서 관리할 수 있습니다.',
              },
              {
                no: 9,
                title: 'CSS와 SCSS 차이점',
                content:
                  'SCSS는 CSS의 확장된 버전으로 변수, 중첩, 믹스인 등을 지원합니다.',
              },
              {
                no: 10,
                title: 'Git과 GitHub 사용법',
                content:
                  'Git은 버전 관리 시스템이며, GitHub는 이를 활용한 원격 저장소 플랫폼입니다.',
              },
            ],
            openedPostNo: null,
          };
        },
        methods: {
          togglePost(no) {
            if (this.openedPostNo === no) {
              this.openedPostNo = null;
            } else {
              this.openedPostNo = no;
            }
          },
          closePost() {
            this.openedPostNo = null;
          },
        },
      }).mount('#app');
    </script>

    <style>
      body {
        background: #f4f4f4;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      #app {
        width: 960px;
        margin: 0 auto;
        padding: 20px 0;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
      }

      ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }

      li {
        margin-bottom: 10px;
      }

      .post-item {
        cursor: pointer;
        padding: 18px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
      }

      .post-item:hover {
        background: #ececec;
      }

      .post-content {
        margin-top: 8px;
        padding: 18px 16px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fff;
      }

      .post-content h2 {
        margin-top: 0;
        margin-bottom: 20px;
      }

      .post-content p {
        margin-bottom: 24px;
        line-height: 1.6;
      }

      button {
        padding: 8px 14px;
        border: none;
        background: #ff6b6b;
        color: white;
        cursor: pointer;
        border-radius: 4px;
        font-size: 14px;
      }

      button:hover {
        background: #ff4f4f;
      }

      .arrow {
        font-size: 14px;
        color: #888;
      }
    </style>
  </body>
</html>
